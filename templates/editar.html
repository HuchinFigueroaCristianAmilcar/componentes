{% extends 'base.html' %}
{% block titulo %}Editar {{ articulo.nombre }} · Componentes PC{% endblock %}
{% block contenido %}
<div class="row justify-content-center">
<div class="col-lg-8">
<section class="panel">
<h2 class="panel-title">Editar componente</h2>
<form method="post" action="{{ url_for('editar', id=articulo._id) }}" class="row g-3">
<input type="hidden" name="csrf" value="{{ csrf_token() }}">
<div class="col-12">
<label for="nombre" class="form-label">Producto</label>
<input id="nombre" name="nombre" class="form-control" value="{{ articulo.nombre }}" required maxlength="80">
</div>
<div class="col-md-6">
<label for="categoria" class="form-label">Categoría</label>
<input id="categoria" name="categoria" class="form-control" value="{{ articulo.categoria }}" required maxlength="20">
</div>
<div class="col-md-3">
<label for="precio" class="form-label">Precio (MXN)</label>
<input id="precio" name="precio" type="number" min="0" max="1000000" step="0.01" class="form-control" value="{{ articulo.get('precio', 0) }}">
</div>
<div class="col-md-3">
<label for="estado" class="form-label">Estado</label>
<select id="estado" name="estado" class="form-select" required>
<option value="">Selecciona</option>
{% for opcion in ['Disponible', 'Agotado'] %}
<option value="{{ opcion }}" {% if articulo.get('estado') == opcion %}selected{% endif %}>{{ opcion }}</option>
{% endfor %}
</select>
</div>
<div class="col-12">
<label for="descripcion" class="form-label">Descripción</label>
<textarea id="descripcion" name="descripcion" class="form-control" rows="3" maxlength="400">{{ articulo.get('descripcion', '') }}</textarea>
</div>
<div class="col-12">
<label for="imagen" class="form-label">URL de imagen</label>
<input id="imagen" name="imagen" type="url" class="form-control" maxlength="300" value="{{ articulo.get('imagen', '') }}" placeholder="https://…">
</div>
<div class="col-12 d-flex gap-2 flex-wrap">
<button type="submit" class="btn btn-primary">Guardar cambios</button>
<a class="btn btn-ghost" href="{{ url_for('admin') }}#lista">Cancelar</a>
</div>
</form>
</section>
</div>
</div>
{% endblock %}
