{% extends 'base.html' %}
{% block contenido %}
<div class="row justify-content-center">
<div class="col-lg-8">
<section class="card shadow-sm">
<div class="card-body p-4">
<h2 class="h4 mb-3">Editar componente</h2>
<form method="post"
action="{{ url_for('editar', id=articulo._id) }}">
<div class="mb-3">
<label for="nombre" class="form-label">Producto</label>
<input id="nombre" name="nombre" class="form-control"
value="{{ articulo.nombre }}" required maxlength="80">
</div>
<div class="mb-3">
<label for="categoria" class="form-label">Categoría</label>
<input id="categoria" name="categoria" class="form-control"
value="{{ articulo.categoria }}" required maxlength="20">
</div>
<div class="mb-3">
<label for="estado" class="form-label">Estado</label>
<select id="estado" name="estado" class="form-select" required>
<option value="">Selecciona</option>
{% for opcion in ['Disponible', 'Agotado'] %}
<option value="{{ opcion }}"
{% if articulo.get('estado') == opcion %}selected{% endif %}>
{{ opcion }}
</option>
{% endfor %}
</select>
</div>
<div class="d-flex gap-2 flex-wrap">
<button type="submit" class="btn btn-primary">
Guardar cambios
</button>
<a class="btn btn-outline-secondary"
href="{{ url_for('inicio') }}#lista">Cancelar</a>
</div>
</form>
</div>
</section>
</div>
</div>
{% endblock %}
